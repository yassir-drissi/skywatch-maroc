# Intégration continue : à chaque push et à chaque Pull Request vers main,
# GitHub lance deux jobs en parallèle :
#   - python : lint, tests et vérification de docker-compose.yml (ingestion)
#   - scala  : compilation, tests et jar du job Spark (streaming)
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: python
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ingestion/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ingestion/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

      - name: Vérifier docker-compose.yml
        run: |
          # docker-compose.yml lit .env : en CI on utilise l'exemple, sans secret
          cp .env.example .env
          docker compose config --quiet

  scala:
    name: scala
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # même Java que l'image Docker Spark
          cache: sbt

      - name: Installer sbt
        uses: sbt/setup-sbt@v1

      - name: Tests et jar (sbt)
        run: sbt streaming/test streaming/package