# Intégration continue : à chaque push et à chaque Pull Request vers main,
# GitHub lance le lint, les tests et la vérification de docker-compose.yml.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ingestion/requirements.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r ingestion/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

      - name: Vérifier docker-compose.yml
        run: |
          # docker-compose.yml lit .env : en CI on utilise l'exemple, sans secret
          cp .env.example .env
          docker compose config --quiet