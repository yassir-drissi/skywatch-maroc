name: skywatch

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: skywatch-kafka
    ports:
      - "9092:9092"
    environment:
      # Mode KRaft : Kafka sans ZooKeeper (un seul nœud, broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL : pour les autres conteneurs / EXTERNAL : pour ton PC
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: skywatch-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: skywatch-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: skywatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  flights-producer:
    build: ./ingestion
    image: skywatch/ingestion:latest
    container_name: skywatch-flights-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # les topics doivent exister avant
    env_file: .env                                   # identifiants OpenSky
    environment:
      # Adresse INTERNE : dans Docker, « localhost » serait le conteneur lui-même
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped                          # redémarre seul après une panne

volumes:
  kafka-data: