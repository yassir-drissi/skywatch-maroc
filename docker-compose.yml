name: skywatch

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: skywatch-kafka
    ports:
      - "9092:9092"
    environment:
      # Mode KRaft : Kafka sans ZooKeeper (un seul nœud, broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL : pour les autres conteneurs / EXTERNAL : pour ton PC
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: skywatch-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./scripts/create_topics.sh:/create_topics.sh:ro
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: skywatch-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: skywatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  flights-producer:
    build: ./ingestion
    image: skywatch/ingestion:latest
    container_name: skywatch-flights-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # les topics doivent exister avant
    env_file: .env                                   # identifiants OpenSky
    environment:
      # Adresse INTERNE : dans Docker, « localhost » serait le conteneur lui-même
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped                          # redémarre seul après une panne

  weather-producer:
    build: ./ingestion                               # même code, même image que flights-producer
    image: skywatch/ingestion:latest
    container_name: skywatch-weather-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "skywatch_ingestion.weather_producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  spark-streaming:
    image: spark:3.5.7-scala2.12-java17-ubuntu        # Spark 3.5.7, Scala 2.12, Java 17 (même version que build.sbt)
    container_name: skywatch-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]                                       # Spark en local dans le conteneur, 2 cœurs
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/tmp/.ivy2                      # dossier de téléchargement des --packages
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7   # connecteur Kafka (pas inclus dans l'image)
      - --class
      - ma.skywatch.streaming.StreamingApp                 # Bronze + trafic (+ alertes en 8d)
      - /opt/skywatch/jars/skywatch-streaming_2.12-0.1.0.jar
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LAKE_PATH: /opt/skywatch/data/lake
    volumes:
      - ./streaming/target/scala-2.12:/opt/skywatch/jars:ro   # le jar construit par « sbt streaming/package »
      - ./data:/opt/skywatch/data                              # Bronze + checkpoints, visibles sur le PC
    ports:
      - "4040:4040"                                    # Spark UI
    restart: unless-stopped

  # Semaine 3 : Silver / Gold en PySpark + Delta Lake (batch, lancé à la demande)
  #   docker compose --profile batch run --rm lakehouse jobs/run_silver.py
  lakehouse:
    image: spark:3.5.7-scala2.12-java17-python3-ubuntu   # même Spark que le streaming, avec Python
    container_name: skywatch-lakehouse
    profiles: ["batch"]                                 # pas démarré par « docker compose up »
    working_dir: /opt/skywatch/databricks
    entrypoint:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - io.delta:delta-spark_2.12:3.2.1                 # Delta Lake 3.2 = Spark 3.5
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.sql.shuffle.partitions=8                  # petites données (200 par défaut)
      - --conf
      - spark.ui.showConsoleProgress=false
    command: ["jobs/run_silver.py"]
    environment:
      LAKE_PATH: /opt/skywatch/data/lake
    volumes:
      - ./databricks:/opt/skywatch/databricks:ro
      # MÊME chemin que spark-streaming : Bronze contient _spark_metadata avec des chemins absolus
      - ./data:/opt/skywatch/data

volumes:
  kafka-data: